[API]
base_url = http://okpai
username = reservoir_admin
password = ""
tenant = reservoir
patron_api = "https://patron-api.internal"
; Timeout, in seconds, for Reservoir and patron API requests.
http_timeout = 120

[Site]
; URL used as the destination after a user logs out.
logout_url = "https://mysite.tdl"

[OpenURL]
; Identifier sent as the OpenURL/COinS referrer ID.
referrer_id = "reshare.indexdata.com/si"

[BlankRequests]
; Enable links to an external blank-request form. The base URL is expected to
; accept the patron's institution as its final path segment and the configured
; values below as query parameters.
enabled = false
base_url = ""
referrer_id = ""
loan_service_id = "loan"
copy_service_id = "copy"

[Requests]
; VuFind should use the 'patron_requested' cancellation reason when
; cancelling requests since cancelling from VuFind is always Patron initiated.
cancellation_reason = 'patron_requested'
; Maximum number of patron requests to retrieve in a single API call.
page_size = 500
; Records whose identifiers start with any of these values are not requestable.
; VuFind will hide their request links and display a static "Available" holding
; instead of retrieving holdings from ReShare.
;non_requestable_id_prefixes[] = "ebooksmn"
;non_requestable_id_prefixes[] = "lelib"

[members]
; Map institution codes accepted by the patron API to login display names.
ISIL:US-EXAMPLE = Example College
ISIL:US-EXAMPLE1 = Example 1 Public Library

[states]
; Map ReShare state codes to display names.
REQ_IDLE = "Request Sent"
REQ_VALIDATED = "Request Sent"
REQ_SOURCING_ITEM = "Request Sent"
REQ_SUPPLIER_IDENTIFIED = "Request Sent"
REQ_REQUEST_SENT_TO_SUPPLIER = "Request Sent"
REQ_BORROWER_RETURNED = "Returned"
REQ_BORROWING_LIBRARY_RECEIVED = "Arrived - Library Will Contact You"
REQ_CHECKED_IN = "Arrived - Library Will Contact You"
REQ_AWAITING_RETURN_SHIPPING = "Returned"
REQ_SHIPPED = "Shipped"
REQ_REQUEST_COMPLETE = "Complete"
REQ_ERROR = "Request Error"
REQ_END_OF_ROTA = "No Available Supplier"
REQ_INVALID_PATRON = "Request Error"
REQ_EXPECTS_TO_SUPPLY = "Request Sent"
REQ_SHIPPED_TO_SUPPLIER = "Returned"
REQ_CONDITIONAL_ANSWER_RECEIVED = "Loan Has Conditions"
REQ_CANCEL_PENDING = "Cancel Pending"
REQ_CANCELLED_WITH_SUPPLIER = "Cancelled"
REQ_CANCELLED = "Cancelled"
REQ_UNFILLED = "No Available Supplier"
REQ_OVERDUE = "Arrived - Library Will Contact You"
REQ_LOCAL_REVIEW = "Staff Review - Locally Available"
REQ_FILLED_LOCALLY = "Filled by Local Library"
REQ_UNABLE_TO_CONTACT_SUPPLIER = "Unable to Contact Supplier"
REQ_LOANED_DIGITALLY = "Loaned Digitally"
